[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "gphotos-uploader"
version = "0.1.0"
description = "Bulk upload photos to Google Photos with resumable state and compression"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "typer>=0.12",
    "rich>=13",
    "pillow>=10",
    "pillow-heif>=0.15",
    "piexif>=1.1",
    "httpx>=0.27",
    "google-auth>=2",
    "google-auth-oauthlib>=1",
    "plyer>=2",
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "pytest-cov>=5",
    "respx>=0.21",
]

[project.scripts]
gphotos = "cli.main:app"

[tool.hatch.build.targets.wheel]
packages = ["uploader", "cli"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--cov=uploader --cov=cli --cov-report=term-missing"

[tool.coverage.run]
omit = ["tests/*"]

[tool.coverage.report]
fail_under = 80
